<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vital Apps</title>
<meta name="description" content="Small, focused iPhone apps from an independent London studio." />
<meta name="theme-color" content="#0B0B0D" />
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 20 L12 4 L16 12 L12 20 Z' fill='%232FB47A'/%3E%3Cpath d='M12 20 L16 12 L20 20 Z' fill='%230F7A4B'/%3E%3C/svg%3E" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Vital Apps" />
<meta property="og:description" content="Apps built to be loved, not just downloaded." />
<meta property="og:url" content="https://vitalapps.co.uk/" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0D;
    --surface: #17171B;
    --line: rgba(255, 255, 255, 0.08);
    --text: #F5F5F7;
    --soft: rgba(245, 245, 247, 0.62);
    --faint: rgba(245, 245, 247, 0.5);
    --gold: #F5C542;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #6E5A57;
    background: radial-gradient(120% 90% at 50% 0%, #8A7470 0%, #5B4845 100%);
    color: var(--text);
    min-height: 100svh;
    padding: clamp(0rem, 3vw, 2.5rem);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 0.125rem solid var(--gold); outline-offset: 0.1875rem; border-radius: 0.5rem; }

  /* ---------- FRAME ---------- */
  .frame {
    position: relative;
    max-width: 90rem;
    height: calc(100svh - 2 * clamp(0rem, 3vw, 2.5rem));
    margin: 0 auto;
    background: var(--bg);
    border-radius: clamp(0rem, 3vw, 2rem);
    box-shadow: 0 0 0 0.0625rem rgba(255, 255, 255, 0.35), 0 2.5rem 5.625rem -1.875rem rgba(0, 0, 0, 0.6);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .grid {
    position: absolute; inset: 0;
    pointer-events: none;
    perspective: 43.75rem;
    overflow: hidden;
  }
  .grid::before {
    content: "";
    position: absolute;
    left: -50%; right: -50%; bottom: -10%;
    height: 80%;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.07) 0.0625rem, transparent 0.0625rem),
      linear-gradient(90deg, rgba(255, 255, 255, 0.07) 0.0625rem, transparent 0.0625rem);
    background-size: 7.5rem 7.5rem;
    transform: rotateX(62deg);
    transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 100%);
  }
  .glow {
    position: absolute;
    left: 50%; bottom: 8%;
    width: min(56.25rem, 110vw); height: 26.25rem;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(245, 197, 66, 0.2) 0%, rgba(245, 197, 66, 0.05) 40%, transparent 70%);
    filter: blur(1.875rem);
    pointer-events: none;
  }

  /* ---------- NAV ---------- */
  .nav {
    position: relative; z-index: 5;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;
    padding: 1.375rem clamp(1.125rem, 3vw, 2.25rem);
  }
  .nav-left { display: flex; align-items: center; gap: 0.5rem; }
  .tab {
    display: inline-flex; align-items: center; gap: 0.4375rem;
    padding: 0.5625rem 1rem;
    border-radius: 62.4375rem;
    font-size: 0.8125rem; font-weight: 500;
    color: var(--soft);
    transition: color 0.2s var(--ease), background 0.2s var(--ease);
  }
  .tab svg { width: 0.9375rem; height: 0.9375rem; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 0.0625rem var(--line); }
  .search {
    position: relative;
    display: flex; align-items: center; gap: 0.5rem;
    margin-left: 0.375rem;
    padding: 0 0.875rem;
    height: 2.375rem; width: 13.75rem;
    border-radius: 62.4375rem;
    background: var(--surface);
    box-shadow: inset 0 0 0 0.0625rem var(--line);
  }
  .search svg { width: 0.9375rem; height: 0.9375rem; color: var(--faint); flex-shrink: 0; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 0.8125rem; }
  .search input::placeholder { color: var(--faint); }
  .results {
    position: absolute; top: calc(100% + 0.5rem); left: 0; right: 0;
    background: var(--surface);
    border-radius: 0.875rem;
    box-shadow: 0 0 0 0.0625rem var(--line), 0 1.25rem 2.5rem -0.75rem rgba(0, 0, 0, 0.7);
    padding: 0.375rem;
    display: none;
  }
  .results.open { display: block; }
  .result { display: flex; align-items: center; gap: 0.625rem; padding: 0.5rem 0.625rem; border-radius: 0.625rem; font-size: 0.8125rem; font-weight: 500; }
  .result:hover, .result.active { background: rgba(255, 255, 255, 0.06); }
  .result img { width: 1.75rem; height: 1.75rem; border-radius: 0.4375rem; object-fit: cover; }
  .result-empty { padding: 0.75rem; font-size: 0.78125rem; color: var(--faint); text-align: center; }
  .logo { display: flex; justify-content: center; }
  .logo svg { width: 2.625rem; height: 2.625rem; }
  .nav-right { display: flex; justify-content: flex-end; align-items: center; gap: 0.5rem; }
  .contact {
    display: inline-flex; align-items: center;
    padding: 0.5625rem 1.125rem;
    border-radius: 62.4375rem;
    background: var(--gold);
    color: #1B1400;
    font-size: 0.8125rem; font-weight: 600;
    transition: transform 0.2s var(--ease);
  }
  .contact:hover { transform: translateY(-0.0625rem); }

  /* ---------- HERO ---------- */
  .hero {
    position: relative; z-index: 2;
    text-align: center;
    padding: clamp(1.5rem, 5vh, 3.5rem) 1.5rem 0;
  }
  h1 {
    font-family: "Saira Stencil One", "Inter", sans-serif;
    font-weight: 400;
    font-size: clamp(2.5rem, min(7vw, 8.5vh), 6rem);
    line-height: 1.02;
    letter-spacing: 0.01em;
    text-wrap: balance;
    max-width: 14ch;
    margin: 0 auto;
  }
  .lede {
    margin: 1.25rem auto 0;
    max-width: 52ch;
    font-size: clamp(0.875rem, 1.4vw, 1rem);
    line-height: 1.6;
    color: var(--soft);
  }

  /* ---------- FLOATING ICONS ---------- */
  .floater {
    position: absolute; z-index: 1;
    width: clamp(4rem, min(9vw, 12vh), 7.25rem);
    aspect-ratio: 1;
    border-radius: 24%;
    overflow: hidden;
    box-shadow: 0 1.5rem 3.125rem -1rem rgba(0, 0, 0, 0.75), 0 0 0 0.0625rem rgba(255, 255, 255, 0.1);
    animation: bob 7s ease-in-out infinite;
  }
  .floater img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .floater.l { left: 9%; top: 34%; --r: -12deg; }
  .floater.r { right: 9%; top: 44%; --r: 14deg; animation-delay: -3.5s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--r)); }
    50% { transform: translateY(-0.875rem) rotate(var(--r)); }
  }

  /* ---------- CARD FAN ---------- */
  .fan {
    position: relative; z-index: 3;
    margin-top: auto;
    padding-top: clamp(2.5rem, 6vh, 4.5rem);
    display: flex;
    justify-content: center;
    align-items: flex-end;
    list-style: none;
  }
  .fan li { flex: 0 0 auto; }
  .fan li + li { margin-left: clamp(-2.75rem, -3vw, -1.5rem); }
  .app-card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: clamp(7rem, min(14.5vw, 20vh), 13.125rem);
    aspect-ratio: 0.82;
    padding: 1rem;
    border-radius: 1.75rem 1.75rem 0 0;
    background: var(--c);
    color: var(--ink, #111);
    box-shadow: -1.125rem 0 2.5rem -1.125rem rgba(0, 0, 0, 0.55);
    transform: translateY(var(--y, 0)) rotate(var(--rot, 0deg));
    transform-origin: 50% 100%;
    transition: transform 0.45s var(--ease);
  }
  .app-card:hover, .app-card:focus-visible { transform: translateY(calc(var(--y, 0) - 1.375rem)) rotate(var(--rot, 0deg)); }
  .fan li:hover, .fan li:focus-within { z-index: 20; }
  .fan li:nth-child(1) .app-card { --y: 2.375rem; --rot: -9deg; }
  .fan li:nth-child(2) .app-card { --y: 1.125rem; --rot: -6deg; }
  .fan li:nth-child(3) .app-card { --y: 0.375rem; --rot: -3deg; }
  .fan li:nth-child(4) .app-card { --y: 0rem; --rot: 0deg; width: clamp(8.5rem, min(18vw, 26vh), 16.25rem); }
  .fan li:nth-child(5) .app-card { --y: 0.375rem; --rot: 3deg; }
  .fan li:nth-child(6) .app-card { --y: 1.125rem; --rot: 6deg; }
  .fan li:nth-child(7) .app-card { --y: 2.375rem; --rot: 9deg; }
  .fan li { position: relative; }
  .fan li:nth-child(4) { z-index: 10; }
  .fan li:nth-child(5) { z-index: 9; }
  .fan li:nth-child(6) { z-index: 8; }
  .fan li:nth-child(7) { z-index: 7; }
  .fan li:nth-child(n+5) .app-card { text-align: right; }
  .fan li:nth-child(n+5) .badge { align-self: flex-start; }
  .badge {
    align-self: flex-end;
    display: inline-flex; align-items: center; gap: 0.3125rem;
    padding: 0.3125rem 0.625rem;
    border-radius: 62.4375rem;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font-size: 0.71875rem; font-weight: 600;
  }
  .badge .dot { width: 0.375rem; height: 0.375rem; border-radius: 50%; background: #3DDC84; }
  .badge.soon .dot { background: var(--gold); }
  .app-card { overflow: hidden; }
  .card-icon {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .card-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: relative; z-index: 1; }
  .card-text {
    position: relative; z-index: 1;
    margin: 0 -1rem -1rem;
    padding: 2.5rem 1rem 1rem;
    background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.72) 100%);
    color: #fff;
  }
  .card-name { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
  .card-line { font-size: 0.75rem; line-height: 1.4; opacity: 0.72; margin-top: 0.125rem; }

  /* ---------- FOOTER STRIP ---------- */
  .legal {
    position: relative; z-index: 4;
    display: flex; justify-content: center; gap: 1.25rem;
    padding: 0.875rem;
    font-size: 0.71875rem; color: var(--faint);
    background: var(--bg);
    border-top: 0.0625rem solid var(--line);
  }
  .legal a:hover { color: var(--text); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 1080px) {
    .search { width: 10.625rem; }
    .fan li:nth-child(1), .fan li:nth-child(7) { display: none; }
  }
  @media (max-width: 760px) {
    body { padding: 0; }
    .frame { height: auto; min-height: 100svh; }
    .nav { grid-template-columns: auto 1fr; }
    .logo { order: -1; justify-content: flex-start; }
    .nav-left .search, .tab.store { display: none; }
    .nav-left { justify-content: flex-end; }
    .nav-right { display: none; }
    .floater { display: none; }
    .fan {
      justify-content: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 2.5rem 1.25rem 0;
      gap: 0.75rem;
    }
    .fan li + li { margin-left: 0; }
    .fan li { scroll-snap-align: center; }
    .fan li:nth-child(1), .fan li:nth-child(7) { display: block; }
    .fan li:nth-child(n) .app-card { --y: 0rem; --rot: 0deg; width: 11.875rem; border-radius: 1.5rem; text-align: left; }
    .fan li:nth-child(n) .badge { align-self: flex-end; }
  }
  @media (min-width: 761px) and (max-height: 760px) {
    .nav { padding-block: 0.875rem; }
    .hero { padding-top: 0.25rem; }
    .lede { margin-top: 0.625rem; font-size: 0.8125rem; }
    .fan { padding-top: 1rem; }
    .legal { padding: 0.625rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .floater { animation: none; transform: rotate(var(--r)); }
    .app-card { transition: none; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="grid" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <nav class="nav" aria-label="Main">
    <div class="nav-left">
      <a class="tab active" href="/" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/></svg>
        Apps
      </a>
      <a class="tab store" href="/studio/">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Studio
      </a>
      <div class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search apps" autocomplete="off" aria-label="Search apps" />
        <div class="results" id="results" role="listbox"></div>
      </div>
    </div>
    <a class="logo" href="/" aria-label="Vital Apps home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 20 L12 4 L16 12 L12 20 Z" fill="#2FB47A"/><path d="M12 20 L16 12 L20 20 Z" fill="#0F7A4B"/></svg>
    </a>
    <div class="nav-right">
      <a class="contact" href="mailto:vitalappsltd@gmail.com">Contact</a>
    </div>
  </nav>

  <header class="hero">
    <h1>Apps built to be loved</h1>
    <p class="lede">Small, focused iPhone apps from an independent London studio. Pick one below to see what it does.</p>
  </header>

  <a class="floater l" href="/rise/" aria-label="RISE"><img src="assets/rise-icon.webp" alt="" width="512" height="512" /></a>
  <a class="floater r" href="/arrowflow/" aria-label="Arrow Flow"><img src="assets/arrowflow-icon.webp" alt="" width="512" height="512" /></a>

  <ul class="fan" id="fan"></ul>

  <footer class="legal">
    <span>© 2026 VitalApps Ltd</span>
    <a href="/studio/">Studio</a>
    <a href="/privacy/">Privacy</a>
    <a href="/support/">Support</a>
    <a href="mailto:vitalappsltd@gmail.com">Contact</a>
  </footer>
</div>

<script>
  var APPS = [
    { name: 'Arrow Flow', line: 'An arrow puzzle wrapped in colour.', url: '/arrowflow/', icon: 'assets/arrowflow-icon.webp', c: '#BFD3FF', soon: true },
    { name: 'DualShot', line: 'Vertical and horizontal video at once.', url: '/dualshot/', icon: 'assets/dualshot-icon.webp', c: '#FFE08A' },
    { name: 'SwipeClean', line: 'Clean your camera roll one swipe at a time.', url: '/swipeclean/', icon: 'assets/swipeclean-icon.webp', c: '#FFB3CD' },
    { name: 'UseBy', line: 'Scan food, snap the date, get reminded.', url: '/useby/', icon: 'assets/useby-icon.webp', c: '#F6E7A1' },
    { name: 'Relapsr', line: 'Track every clean day in recovery.', url: '/relapsr/', icon: 'relapsr-logo.svg', c: '#A8EBDD' },
    { name: 'Maxxr', line: 'Face analysis and a glow up routine.', url: '/maxxr/', icon: 'assets/maxxr-icon.webp', c: '#D9C4FF' },
    { name: 'RISE', line: 'Time each tap and stack it high.', url: '/rise/', icon: 'assets/rise-icon.webp', c: '#FFC2B0', soon: true }
  ];

  var fan = document.getElementById('fan');
  APPS.forEach(function (app) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.className = 'app-card';
    a.href = app.url;
    a.style.setProperty('--c', app.c);
    a.innerHTML =
      '<span class="badge' + (app.soon ? ' soon' : '') + '"><span class="dot"></span>' + (app.soon ? 'Soon' : 'iOS') + '</span>' +
      '<span class="card-icon"><img src="' + app.icon + '" alt="" width="512" height="512" /></span>' +
      '<span class="card-text"><span class="card-name"></span><span class="card-line"></span></span>';
    a.querySelector('.card-name').textContent = app.name;
    a.querySelector('.card-line').textContent = app.line;
    a.querySelector('.card-line').style.display = 'block';
    li.appendChild(a);
    fan.appendChild(li);
  });

  var input = document.getElementById('searchInput');
  var results = document.getElementById('results');
  var active = 0;
  function render() {
    var q = input.value.trim().toLowerCase();
    var hits = APPS.filter(function (a) { return !q || a.name.toLowerCase().indexOf(q) !== -1 || a.line.toLowerCase().indexOf(q) !== -1; });
    results.textContent = '';
    active = 0;
    if (!hits.length) {
      var empty = document.createElement('div');
      empty.className = 'result-empty';
      empty.textContent = 'No apps match that';
      results.appendChild(empty);
    }
    hits.forEach(function (app, i) {
      var r = document.createElement('a');
      r.className = 'result' + (i === 0 ? ' active' : '');
      r.href = app.url;
      r.setAttribute('role', 'option');
      r.innerHTML = '<img src="' + app.icon + '" alt="" /><span></span>';
      r.querySelector('span').textContent = app.name;
      results.appendChild(r);
    });
    results.classList.add('open');
  }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('keydown', function (e) {
    var items = results.querySelectorAll('.result');
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      items.forEach(function (el, i) { el.classList.toggle('active', i === active); });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      location.href = items[active].href;
    } else if (e.key === 'Escape') {
      results.classList.remove('open');
      input.blur();
    }
  });
  document.addEventListener('click', function (e) {
    if (!document.getElementById('search').contains(e.target)) results.classList.remove('open');
  });
</script>
</body>
</html>
