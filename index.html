<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vital Apps</title>
<meta name="description" content="Small, focused iPhone apps from an independent London studio." />
<meta name="theme-color" content="#0B0B0D" />
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 20 L12 4 L16 12 L12 20 Z' fill='%232FB47A'/%3E%3Cpath d='M12 20 L16 12 L20 20 Z' fill='%230F7A4B'/%3E%3C/svg%3E" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Vital Apps" />
<meta property="og:description" content="Apps built to be loved, not just downloaded." />
<meta property="og:url" content="https://vitalapps.co.uk/" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Allerta+Stencil&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0D;
    --surface: #17171B;
    --line: rgba(255, 255, 255, 0.08);
    --text: #F5F5F7;
    --soft: rgba(245, 245, 247, 0.62);
    --faint: rgba(245, 245, 247, 0.5);
    --gold: #F5C542;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, input:focus-visible { outline: 0.125rem solid var(--gold); outline-offset: 0.1875rem; border-radius: 0.5rem; }

  /* ---------- STAGE (one screen) ---------- */
  .stage {
    position: relative;
    height: 100svh;
    min-height: 32rem;
    overflow: hidden;
    background: var(--bg);
  }
  .room { position: absolute; inset: 0; pointer-events: none; perspective: 50rem; }
  .room span {
    position: absolute;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.09) 0.0625rem, transparent 0.0625rem),
      linear-gradient(90deg, rgba(255, 255, 255, 0.09) 0.0625rem, transparent 0.0625rem);
    background-size: 9rem 9rem;
  }
  .room .floor {
    left: -40%; right: -40%; bottom: -20%; height: 75%;
    transform: rotateX(70deg);
    transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 50%);
    mask-image: linear-gradient(180deg, transparent 0%, #000 50%);
  }
  .room .wall-l, .room .wall-r {
    top: -10%; bottom: -10%; width: 45%;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, transparent 90%);
    mask-image: linear-gradient(90deg, #000 0%, transparent 90%);
  }
  .room .wall-l { left: 0; transform: rotateY(62deg); transform-origin: 0 50%; }
  .room .wall-r {
    right: 0; transform: rotateY(-62deg); transform-origin: 100% 50%;
    -webkit-mask-image: linear-gradient(270deg, #000 0%, transparent 90%);
    mask-image: linear-gradient(270deg, #000 0%, transparent 90%);
  }
  .glow {
    position: absolute;
    left: 50%; top: 42%;
    width: 60vw; height: 40svh;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(245, 197, 66, 0.22) 0%, rgba(245, 197, 66, 0.05) 45%, transparent 70%);
    filter: blur(1.875rem);
    pointer-events: none;
  }

  /* ---------- NAV ---------- */
  .nav {
    position: relative; z-index: 5;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;
    padding: 1.25rem clamp(1rem, 3vw, 2.25rem);
  }
  .nav-left { display: flex; align-items: center; gap: 0.5rem; }
  .tab {
    display: inline-flex; align-items: center; gap: 0.4375rem;
    padding: 0.5rem 0.9375rem;
    border-radius: 999rem;
    font-size: 0.8125rem; font-weight: 500;
    color: var(--soft);
    transition: color 0.2s var(--ease);
  }
  .tab svg { width: 0.9375rem; height: 0.9375rem; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 0.0625rem var(--line); }
  .search {
    position: relative;
    display: flex; align-items: center; gap: 0.5rem;
    margin-left: 0.375rem;
    padding: 0 0.875rem;
    height: 2.375rem; width: 13.75rem;
    border-radius: 999rem;
    background: var(--surface);
    box-shadow: inset 0 0 0 0.0625rem var(--line);
  }
  .search svg { width: 0.9375rem; height: 0.9375rem; color: var(--faint); flex-shrink: 0; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 0.8125rem; }
  .search input::placeholder { color: var(--faint); }
  .results {
    position: absolute; top: calc(100% + 0.5rem); left: 0; right: 0;
    background: var(--surface);
    border-radius: 0.875rem;
    box-shadow: 0 0 0 0.0625rem var(--line), 0 1.25rem 2.5rem -0.75rem rgba(0, 0, 0, 0.7);
    padding: 0.375rem;
    display: none;
  }
  .results.open { display: block; }
  .result { display: flex; align-items: center; gap: 0.625rem; padding: 0.5rem 0.625rem; border-radius: 0.625rem; font-size: 0.8125rem; font-weight: 500; }
  .result:hover, .result.active { background: rgba(255, 255, 255, 0.06); }
  .result img { width: 1.75rem; height: 1.75rem; border-radius: 0.4375rem; object-fit: cover; }
  .result-empty { padding: 0.75rem; font-size: 0.78125rem; color: var(--faint); text-align: center; }
  .logo { display: flex; justify-content: center; }
  .logo svg { width: 2.5rem; height: 2.5rem; }
  .nav-right { display: flex; justify-content: flex-end; }
  .contact {
    display: inline-flex; align-items: center;
    padding: 0.5rem 1.125rem;
    border-radius: 999rem;
    background: var(--gold);
    color: #1B1400;
    font-size: 0.8125rem; font-weight: 600;
  }

  /* ---------- HERO COPY ---------- */
  .hero {
    position: relative; z-index: 2;
    text-align: center;
    padding: 6svh 1.5rem 0;
  }
  h1 {
    font-family: "Allerta Stencil", "Inter", sans-serif;
    font-weight: 400;
    font-size: clamp(2.25rem, min(5.2vw, 9svh), 5.5rem);
    line-height: 1.08;
    letter-spacing: 0.01em;
    text-wrap: balance;
    max-width: 13ch;
    margin: 0 auto;
  }
  .lede {
    margin: 2.2svh auto 0;
    max-width: 50ch;
    font-size: clamp(0.75rem, 0.95vw, 0.9375rem);
    line-height: 1.6;
    color: var(--faint);
  }

  /* ---------- FLOATING ICONS (coming soon apps) ---------- */
  .floater {
    position: absolute; z-index: 1;
    aspect-ratio: 1;
    border-radius: 24%;
    overflow: hidden;
    box-shadow: 0 1.5rem 3rem -1rem rgba(0, 0, 0, 0.75);
    animation: bob 7s ease-in-out infinite;
  }
  .floater img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .floater.l { left: 8%; top: 28%; width: min(9vw, 16svh); --r: -10deg; }
  .floater.r { right: 9%; top: 41%; width: min(7.5vw, 13svh); --r: 15deg; animation-delay: -3.5s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--r)); }
    50% { transform: translateY(-0.875rem) rotate(var(--r)); }
  }

  /* ---------- CARD FAN ---------- */
  .fan {
    position: absolute; z-index: 3;
    top: 57%; left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    list-style: none;
  }
  .fan li { position: relative; flex: 0 0 auto; }
  .fan li + li { margin-left: min(-1.5vw, -2.6svh); }
  .fan li:nth-child(3) { z-index: 5; }
  .fan li:nth-child(2), .fan li:nth-child(4) { z-index: 4; }
  .fan li:hover, .fan li:focus-within { z-index: 6; }
  .app-card {
    position: relative;
    display: block;
    width: min(14.5vw, 26svh);
    aspect-ratio: 0.82;
    border-radius: 1.75rem;
    overflow: hidden;
    background-image: var(--c);
    box-shadow: 0 -0.5rem 2.5rem -1rem rgba(0, 0, 0, 0.6);
    transform: translateY(var(--y)) rotate(var(--rot));
    transform-origin: 50% 100%;
    transition: transform 0.45s var(--ease);
  }
  .app-card:hover, .app-card:focus-visible { transform: translateY(calc(var(--y) - 1.25rem)) rotate(var(--rot)); }
  .fan li:nth-child(1) .app-card { --y: 13svh; --rot: -8deg; }
  .fan li:nth-child(2) .app-card { --y: 6svh;  --rot: -5deg; width: min(16vw, 29svh); }
  .fan li:nth-child(3) .app-card { --y: 0rem;  --rot: 0deg;  width: min(20vw, 36svh); }
  .fan li:nth-child(4) .app-card { --y: 6svh;  --rot: 5deg;  width: min(16vw, 29svh); }
  .fan li:nth-child(5) .app-card { --y: 13svh; --rot: 8deg; }
  .card-art {
    position: absolute;
    left: 20%; right: 20%; top: 17%;
    aspect-ratio: 1;
  }
  .card-art img {
    width: 100%; height: 100%;
    display: block;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%), linear-gradient(180deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 0%, #000 12%, #000 88%, transparent 100%), linear-gradient(180deg, transparent 0%, #000 12%, #000 88%, transparent 100%);
    mask-composite: intersect;
  }
  .pill {
    position: absolute; z-index: 1;
    top: 5%; right: 6%;
    display: inline-flex; align-items: center; gap: 0.375rem;
    padding: 0.3125rem 0.75rem;
    border-radius: 999rem;
    background: rgba(0, 0, 0, 0.72);
    color: #fff;
    font-size: clamp(0.6875rem, 0.85vw, 0.875rem);
    font-weight: 600;
  }
  .pill .dot { width: 0.4375rem; height: 0.4375rem; border-radius: 50%; background: #3DDC84; }

  /* ---------- FOOTER (below the fold) ---------- */
  footer {
    display: flex; justify-content: center; flex-wrap: wrap; gap: 1.25rem;
    padding: 1.5rem;
    font-size: 0.75rem; color: var(--faint);
    border-top: 0.0625rem solid var(--line);
  }
  footer a:hover { color: var(--text); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 1000px) {
    .search { width: 10.5rem; }
  }
  @media (max-width: 760px) {
    .stage { height: auto; min-height: 100svh; padding-bottom: 2.5rem; }
    .nav { grid-template-columns: auto 1fr; }
    .logo { order: -1; justify-content: flex-start; }
    .nav-left { justify-content: flex-end; }
    .nav-left .search, .tab.store, .nav-right { display: none; }
    .floater { display: none; }
    .fan {
      position: relative; top: auto;
      justify-content: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 2.5rem 1.25rem 0;
      gap: 0.75rem;
    }
    .fan li + li { margin-left: 0; }
    .fan li { scroll-snap-align: center; }
    .fan li:nth-child(n) .app-card { --y: 0rem; --rot: 0deg; width: 13rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .floater { animation: none; transform: rotate(var(--r)); }
    .app-card { transition: none; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="room" aria-hidden="true"><span class="floor"></span><span class="wall-l"></span><span class="wall-r"></span></div>
  <div class="glow" aria-hidden="true"></div>

  <nav class="nav" aria-label="Main">
    <div class="nav-left">
      <a class="tab active" href="/" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="7" height="7" rx="2" stroke="currentColor" stroke-width="2"/></svg>
        Apps
      </a>
      <a class="tab store" href="/studio/">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        Studio
      </a>
      <div class="search" id="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Search apps" autocomplete="off" aria-label="Search apps" />
        <div class="results" id="results" role="listbox"></div>
      </div>
    </div>
    <a class="logo" href="/" aria-label="Vital Apps home">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 20 L12 4 L16 12 L12 20 Z" fill="#2FB47A"/><path d="M12 20 L16 12 L20 20 Z" fill="#0F7A4B"/></svg>
    </a>
    <div class="nav-right">
      <a class="contact" href="mailto:vitalappsltd@gmail.com">Contact</a>
    </div>
  </nav>

  <header class="hero">
    <h1>Apps built to be loved</h1>
    <p class="lede">Small, focused iPhone apps from an independent London studio. Pick one below to see what it does.</p>
  </header>

  <a class="floater l" href="/rise/" aria-label="RISE, coming soon"><img src="assets/rise-icon.webp" alt="" width="512" height="512" /></a>
  <a class="floater r" href="/arrowflow/" aria-label="Arrow Flow, coming soon"><img src="assets/arrowflow-icon.webp" alt="" width="512" height="512" /></a>

  <ul class="fan" id="fan"></ul>
</main>

<footer>
  <span>© 2026 VitalApps Ltd</span>
  <a href="/studio/">Studio</a>
  <a href="/privacy/">Privacy</a>
  <a href="/support/">Support</a>
  <a href="mailto:vitalappsltd@gmail.com">Contact</a>
</footer>

<script>
  var FAN = [
    { name: 'DualShot', url: '/dualshot/', icon: 'assets/dualshot-icon.webp', c: 'linear-gradient(180deg, #1C1C1E 0%, #1C1C1E 100%)' },
    { name: 'SwipeClean', url: '/swipeclean/', icon: 'assets/swipeclean-icon.webp', c: 'linear-gradient(180deg, #FE3C70 0%, #FF5E60 100%)' },
    { name: 'UseBy', url: '/useby/', icon: 'assets/useby-icon.webp', c: 'linear-gradient(180deg, #636A73 0%, #525760 100%)' },
    { name: 'Relapsr', url: '/relapsr/', icon: 'relapsr-logo.svg', c: 'linear-gradient(180deg, #151515 0%, #151515 100%)' },
    { name: 'Maxxr', url: '/maxxr/', icon: 'assets/maxxr-icon.webp', c: 'linear-gradient(180deg, #F5F2F5 0%, #F5F2F5 100%)' }
  ];
  var SEARCH = FAN.concat([
    { name: 'RISE', url: '/rise/', icon: 'assets/rise-icon.webp' },
    { name: 'Arrow Flow', url: '/arrowflow/', icon: 'assets/arrowflow-icon.webp' }
  ]);

  var fan = document.getElementById('fan');
  FAN.forEach(function (app) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.className = 'app-card';
    a.href = app.url;
    a.setAttribute('aria-label', app.name);
    a.style.setProperty('--c', app.c);
    a.innerHTML = '<span class="pill"><span class="dot"></span><span class="pill-name"></span></span>' +
                  '<span class="card-art"><img src="' + app.icon + '" alt="" width="512" height="512" /></span>';
    a.querySelector('.pill-name').textContent = app.name;
    li.appendChild(a);
    fan.appendChild(li);
  });

  var input = document.getElementById('searchInput');
  var results = document.getElementById('results');
  var active = 0;
  function render() {
    var q = input.value.trim().toLowerCase();
    var hits = SEARCH.filter(function (a) { return !q || a.name.toLowerCase().indexOf(q) !== -1; });
    results.textContent = '';
    active = 0;
    if (!hits.length) {
      var empty = document.createElement('div');
      empty.className = 'result-empty';
      empty.textContent = 'No apps match that';
      results.appendChild(empty);
    }
    hits.forEach(function (app, i) {
      var r = document.createElement('a');
      r.className = 'result' + (i === 0 ? ' active' : '');
      r.href = app.url;
      r.setAttribute('role', 'option');
      r.innerHTML = '<img src="' + app.icon + '" alt="" /><span></span>';
      r.querySelector('span').textContent = app.name;
      results.appendChild(r);
    });
    results.classList.add('open');
  }
  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('keydown', function (e) {
    var items = results.querySelectorAll('.result');
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      items.forEach(function (el, i) { el.classList.toggle('active', i === active); });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      location.href = items[active].href;
    } else if (e.key === 'Escape') {
      results.classList.remove('open');
      input.blur();
    }
  });
  document.addEventListener('click', function (e) {
    if (!document.getElementById('search').contains(e.target)) results.classList.remove('open');
  });
</script>
</body>
</html>
